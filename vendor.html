<!doctype html><html lang="en"><head><title>BST Vendor</title><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fb5b1f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BIN SAEED"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script></head><body>
<header><h1>BST Vendor</h1><span id="bell"></span><button onclick="logout()">⎋</button></header><div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="config-and-app.js"></script>
<script>
gate(['vendor'],p=>{let tab='Orders';const T=['Orders','Products','Accounts','Plan','Shop Info'];
 $('#tabs').innerHTML=T.map(t=>`<button data-t="${t}">${t}</button>`).join('');
 $('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
 async function draw(){$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const[s,pr,ac,o,aa,vi,pl,rq]=(await Promise.all([sb.from('vendor_settings').select('*').eq('vendor_id',p.id).maybeSingle(),sb.from('products').select('*').eq('vendor_id',p.id).order('created_at',{ascending:false}),sb.from('accounts').select('*').eq('vendor_id',p.id),sb.from('orders').select('*').eq('vendor_id',p.id).order('created_at',{ascending:false}),sb.from('admin_accounts').select('*'),sb.from('vendor_info').select('*').eq('vendor_id',p.id).maybeSingle(),sb.from('plans').select('*').order('price'),sb.from('plan_requests').select('*').eq('vendor_id',p.id).order('created_at',{ascending:false})])).map(r=>r.data);
  const PL=pl||[],RQ=rq||[];
  const lim=s?.upload_limit??70,used=pr.length,locked=!!s?.locked||used>=lim,app=$('#app');
  if(tab==='Orders')app.innerHTML=(o.map(x=>`<div class="card"><div class="row"><b>${naira(x.total)}</b><span class="tag ${x.status}">${x.status.replace('_',' ')}</span></div><p>${esc(x.customer_name)} — ${esc(x.address)}</p><small>Delivery ${x.delivery_fee?naira(x.delivery_fee):'free'} · Ref: ${esc(x.reference||'-')} · ${new Date(x.created_at).toLocaleString()}</small><p>${x.items.map(i=>esc(i.name)+' ×'+i.q).join(', ')}</p><div class="row">${[['confirmed','Confirm payment'],['shipped','Mark shipped'],['delivered','Delivered']].map(([k,l])=>`<button class="btn s g" data-s="${k}" data-id="${x.id}">${l}</button>`).join('')}</div></div>`).join('')||'<p class=muted>No orders yet.</p>');
  if(tab==='Products')app.innerHTML=`<div class="card"><div class="row"><b>${used} / ${lim} products</b>${locked?'<span class="tag">Locked</span>':''}</div><div class="bar"><i style="width:${Math.min(100,used/lim*100)}%"></i></div></div>${locked?'<div class="warn">Upload limit reached. You can still edit or delete products. Open the Plan tab to pay and unlock more.</div>':`<form class="card" id="pf"><input name=name placeholder="Product name" required><input name=price type=number min=0 placeholder="Price (₦)" required><input name=compare_price type=number min=0 placeholder="Old price (optional, shows a discount)"><input name=delivery_fee type=number min=0 placeholder="Delivery cost for this item (₦, 0 = free)"><input name=stock type=number min=0 placeholder="Stock" required><small>Flash deal ends (optional, needs an old price)</small><input name=deal_ends type=datetime-local><input name=category placeholder="Category (e.g. Lace, Ankara)"><textarea name=description placeholder="Description"></textarea><input name=img type=file accept="image/*"><button class=btn>Upload product</button></form>`}${pr.map(x=>`<div class="card row"><span>${esc(x.name)}<br><small>${naira(x.price)} · ${x.stock} in stock · 🚚 ${+x.delivery_fee?naira(x.delivery_fee):'free'}</small></span><span><button class="btn s g" data-e="${x.id}">Edit</button> <button class="btn s g" data-x="${x.id}">Delete</button></span></div>`).join('')}`;
  if(tab==='Accounts')app.innerHTML=`<p class=muted>Customers see these accounts at checkout.</p>${ac.map(a=>`<div class="card row"><span>${esc(a.bank)} · <b>${esc(a.acct_no)}</b><br>${esc(a.acct_name)}</span><button class="btn s g" data-ad="${a.id}">Remove</button></div>`).join('')}<form class="card" id="af2"><input name=bank placeholder="Bank" required><input name=acct_no placeholder="Account number" required><input name=acct_name placeholder="Account name" required><button class=btn>Add account</button></form>`;
  if(tab==='Plan')app.innerHTML=`<div class="card"><b>${used} / ${lim} products used</b><div class="bar"><i style="width:${Math.min(100,used/lim*100)}%"></i></div></div><h4>Choose a plan</h4>${PL.map(x=>`<div class="card row"><span><b>${esc(x.name)}</b> · ${naira(x.price)}<br><small>${x.upload_limit} products ${esc(x.description||'')}</small></span><button class="btn s" data-plan="${x.id}">I have paid for this</button></div>`).join('')||'<p class=muted>The admin has not added plans yet.</p>'}<h4>Pay to</h4>${aa.map(a=>`<div class="acct"><small>${esc(a.bank)}</small><br><b>${esc(a.acct_no)}</b><br>${esc(a.acct_name)}</div>`).join('')||'<p class=muted>No payment account yet.</p>'}<h4>Your requests</h4>${RQ.map(r=>`<div class="note">${esc(r.plan_name)} · ${naira(r.price)} <span class="tag ${r.status}">${r.status}</span></div>`).join('')||'<p class=muted>None yet.</p>'}`;
  if(tab==='Shop Info')app.innerHTML=`<form class="card" id="vf" style="display:flex;flex-direction:column;gap:8px"><b>Shop info shown to customers</b><small>Shop name</small><input name=shop_name value="${esc((vi&&vi.shop_name)||p.name||'')}"><small>Free delivery on orders over (₦, 0 = off)</small><input name=free_delivery_min type=number min=0 value="${(vi&&vi.free_delivery_min)||0}"><small>Phone</small><input name=phone value="${esc((vi&&vi.phone)||'')}"><small>WhatsApp number with country code, e.g. 2348012345678</small><input name=whatsapp value="${esc((vi&&vi.whatsapp)||'')}"><small>Email</small><input name=email value="${esc((vi&&vi.email)||'')}"><small>Address</small><input name=address value="${esc((vi&&vi.address)||'')}"><small>Policies (delivery, returns, refunds...)</small><textarea name=policies rows=8>${esc((vi&&vi.policies)||'')}</textarea><button class=btn>Save</button></form>`;
  const vf=$('#vf');if(vf)vf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(vf));f.free_delivery_min=+f.free_delivery_min||0;const r=await sb.from('vendor_info').upsert({...f,vendor_id:p.id,updated_at:new Date().toISOString()});toast(r.error?r.error.message:'Saved');draw()};
  const pf=$('#pf');if(pf)pf.onsubmit=async e=>{e.preventDefault();const f=new FormData(pf),file=f.get('img');let image_url=null;
   if(file&&file.size){const path=p.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.]/g,'_');const u=await sb.storage.from('products').upload(path,file);if(u.error)return toast(u.error.message);image_url=sb.storage.from('products').getPublicUrl(path).data.publicUrl}
   const{error}=await sb.from('products').insert({vendor_id:p.id,name:f.get('name'),price:+f.get('price'),delivery_fee:+f.get('delivery_fee')||0,compare_price:f.get('compare_price')?+f.get('compare_price'):null,deal_ends:f.get('deal_ends')?new Date(f.get('deal_ends')).toISOString():null,stock:+f.get('stock'),category:f.get('category'),description:f.get('description'),image_url});
   if(error)toast(error.message.includes('UPLOAD_LIMIT')?'Upload limit reached. Pay the admin to unlock.':error.message);else toast('Product uploaded');draw()};
  const af=$('#af2');if(af)af.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(af));await sb.from('accounts').insert({...f,vendor_id:p.id});draw()}}
 async function editP(id){const{data:x}=await sb.from('products').select('*').eq('id',id).single();if(!x)return;
 const dt=x.deal_ends?new Date(new Date(x.deal_ends)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 const m=modal(`<h3>Edit product</h3><form id="ef" style="display:flex;flex-direction:column;gap:8px"><small>Name</small><input name=name value="${esc(x.name)}" required><small>Price (₦)</small><input name=price type=number min=0 value="${x.price}" required><small>Old price (optional, shows a discount)</small><input name=compare_price type=number min=0 value="${x.compare_price==null?'':x.compare_price}"><small>Delivery cost (₦, 0 = free)</small><input name=delivery_fee type=number min=0 value="${x.delivery_fee||0}"><small>Stock</small><input name=stock type=number min=0 value="${x.stock}" required><small>Category</small><input name=category value="${esc(x.category||'')}"><small>Description</small><textarea name=description>${esc(x.description||'')}</textarea><small>Flash deal ends (optional)</small><input name=deal_ends type=datetime-local value="${dt}"><small>Replace photo (optional)</small><input name=img type=file accept="image/*"><button class=btn>Save changes</button></form>`);
 m.querySelector('#ef').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('img');
  const u={name:f.get('name'),price:+f.get('price'),compare_price:f.get('compare_price')?+f.get('compare_price'):null,delivery_fee:+f.get('delivery_fee')||0,stock:+f.get('stock'),category:f.get('category'),description:f.get('description'),deal_ends:f.get('deal_ends')?new Date(f.get('deal_ends')).toISOString():null};
  if(file&&file.size){const path=p.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.]/g,'_');const up=await sb.storage.from('products').upload(path,file);if(up.error)return toast(up.error.message);u.image_url=sb.storage.from('products').getPublicUrl(path).data.publicUrl}
  const{error}=await sb.from('products').update(u).eq('id',id);if(error)return toast(error.message);toast('Product updated');m.remove();draw()}}
 $('#app').onclick=async e=>{const d=e.target.dataset;let r;
  if(d.s)r=await sb.from('orders').update({status:d.s}).eq('id',d.id);
  else if(d.x&&confirm('Delete this product?'))r=await sb.from('products').delete().eq('id',d.x);
  else if(d.ad)r=await sb.from('accounts').delete().eq('id',d.ad);
  else if(d.e){return editP(d.e)}
  else if(d.plan){const{data:pn}=await sb.from('plans').select('*').eq('id',d.plan).single();if(!pn||!confirm('Have you paid '+naira(pn.price)+' for the '+pn.name+' plan?'))return;r=await sb.from('plan_requests').insert({vendor_id:p.id,plan_id:pn.id,plan_name:pn.name,price:pn.price,upload_limit:pn.upload_limit});if(!r.error)toast('Admin notified. Waiting for approval.')}
  else return;if(r.error)toast(r.error.message);draw()};
 draw()});
</script></body></html>
